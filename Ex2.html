<style>
  .first_button{
   color: white;
   background-color: black;
   height: 50px;
   width: 140px;
   font-size:17px;
   cursor: pointer;
   margin-right: 20px;
   transition: 0.15ss;
  }

  .first_button:hover{
    opacity: 0.8;
  }

  .first_button:active{
    opacity: 0.15;
  }

</style>
<style>
  .Amazon-button{
    color: balck;
    background-color: rgb(255, 216, 20);
    border-radius: 30px;
    height: 43px;
    width: 250px;
    font-size: 19px;
    border: none;
    cursor: pointer;
    margin-right: 15px;
    transition: background-color 0.15s,opacity 0.15s;
    
  }

  .Amazon-button:hover{
    background-color:rgb(239, 208, 10); 
  }

  .Amazon-button:active{
    opacity: 0.2;
  }
</style>

<style>
  .GitHub{
    color: white;
    background-color: rgb(46, 164, 79);
    border-radius: 8px;
    font-size: 22px;
    font-weight: 700;
    height: 57px;
    width: 150px;
    border: none;
    cursor: pointer;
    margin-right: 22px;
    margin-bottom: 10px;
    transition:box-shadow 0.15s,opacity 0.15s ;
  

  }

  .GitHub:hover{
    box-shadow: 3px 6px 6px rgba(0, 0, 0,0.15);
  }

  .GitHub:active{
    opacity: 0.5;
  }
</style>

<style>
  .Bootstrap{
    color: white;
    background-color: rgb(121, 82, 179);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    height: 57px;
    width: 155px;
    font-size: 21px;
    font-weight: 700;
    cursor: pointer;
    margin-right: 10px;
transition:background-color 0.15s,opacity 0.15s ;
  }

  .Bootstrap:hover{
    background-color: rgb(110,70,165);
  }

  .Bootstrap:active{
    opacity: 0.5;
  }
</style>

<style>
  .second-button{
   color: rgb(108, 117, 125);
   background-color: white;
   height: 57px;
   width: 155px;
   font-size: 21px;
   font-weight: 500;
   border-color: rgb(146, 153, 158);
   border-style: solid;
   border-radius: 3px;
   margin-right: 20px;
   margin-bottom: 20px;
   transition: background-color 0.15s,color 0.15s;
  }

  .second-button:hover{
    background-color:rgb(146, 153, 158); 
    color: white;
  }

  .second-button:active{
    background-color: rgba(10, 102, 194,0.4);
    color:rgba(10, 102, 194,0.4);;
  }
</style>

<style>
  .LinkIn{
    color: white;

  }
