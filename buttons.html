<style>
  .SUBSCRIBE-button{
    background-color: rgb(201, 15, 15);
    color: white;
    font-size: 14px;
    border: none;
    height: 40px;
    width: 115px;
    border-radius: 2px;
    cursor: pointer;
    margin-right:8px;
    transition: opacity 0.15s;
  }
  
  .SUBSCRIBE-button:hover{
    opacity: 0.8;
  }

  .SUBSCRIBE-button:active{
    opacity: 0.5;
  }
</style>




<style>
.tweet-button{
  background-color:rgb(29, 155, 240); 
  color: white;
  height: 35px;
  border: none;
  width: 70px;
  border-radius: 100px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
  margin-left: 8px;
  transition: box-shadow 0.15s;
 
  
}

.tweet-button:hover{
 box-shadow: 4px 5px 6px rgba(0,0,0,0.15)
}
.tweet-button:active{
  opacity: 0.6;
}
</style>


<style>
  .join-button{
    background-color: white;
    border-color:rgb(29, 155, 240); 
    border-style: solid;
    border-width: 1px;
    color:rgb(29, 155, 240); 
    height: 35px;
    width: 63;
    border-radius: 2px;
    cursor: pointer;
    transition: background-color 0.15s,color 0.15s;
  }

  .join-button:hover{
    background-color:rgb(29, 155, 240);  
    color:white; 
  }

  .join-button:active{
    opacity: 0.7;
  }
</style>

<button class="SUBSCRIBE-button">
  SUBSCRIBE
</button>


<button class="join-button">
  JOIN
</button>


<button class="tweet-button">
  Tweet
</button>
